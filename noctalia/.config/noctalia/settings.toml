config_version = 14

[accessibility]
ui_scale = 0.95000000670552254

[bar.default]
background_opacity = 0.79999998211860657
capsule = true
capsule_fill = "surface_variant"
capsule_foreground = "primary"
capsule_radius = 12
capsule_thickness = 0.69999998807907104
center = [ "date", "workspaces" ]
end = [ "tray", "group:g2", "control-center" ]
margin_ends = 200
padding = 7
radius_bottom_left = 12
radius_bottom_right = 12
radius_top_left = 4
radius_top_right = 4
scale = 0.95000000670552254
start = [ "group:g1", "ribbon" ]
thickness = 27

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    foreground = "primary"
    id = "g2"
    members = [ "network", "volume", "brightness", "battery" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    foreground = "primary"
    id = "g1"
    members = [ "active_window", "active-workspace" ]
    opacity = 1.0
    padding = 6.0
    radius = 12.0

[control_center]
hidden_tabs = [ "media", "monitor", "system", "weather" ]

[lockscreen]
blurred_desktop = true
transition = []
wallpaper = "/home/sicko/pictures/wallpapers/cartoon-castle.png"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 683.0
    cy = 586.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [ "luochen1990/niri-ribbon", "teagar/niri-workspace-preview", "salemsayed/niri-active-workspace" ]

[shell]
app_icon_color = "primary"
app_icon_colorize = false
avatar_path = "/home/sicko/pictures/wallpapers/p_mount.jpg"
button_borders = false
card_borders = false
input_borders = false
niri_overview_type_to_launch_enabled = true
popup_borders = false

    [shell.animation]
    enabled = false

    [shell.launcher]
    app_grid = true
    category_icons_only = true
    fetch_exchange_rates = false
    layout = "simple"
    show_session_button = false
    show_settings_button = false
    width = 650

    [shell.panel]
    launcher_placement = "attached"

    [shell.session]
    show_shortcuts = false

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "destructive"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = false
        shortcut = "5"
        variant = "default"

[theme]
builtin = "Ayu"
community_palette = "Catppuccin Mocha Mauve-Lavender"
custom_palette = "Catppuccin_Mocha_Mauve"
source = "community"

    [theme.templates]
    builtin_ids = [ "btop", "hyprland", "kitty", "niri" ]
    community_ids = [ "zed" ]

[wallpaper]
enabled = false

    [wallpaper.default]
    path = "/home/sicko/pictures/wallpapers/p_mount.jpg"

    [wallpaper.last]
    path = "/home/sicko/pictures/wallpapers/p_mount.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/sicko/pictures/wallpapers/p_mount.jpg"

[widget.active-workspace]
enable_scroll = false
glyph = ""
label_mode = "index"
type = "salemsayed/niri-active-workspace:active-workspace"

[widget.active_window]
display = "icon_only"
icon_size = 13
min_length = 0
title_scroll = "on_hover"

[widget.audio_visualizer]
bands = 20
color_2 = "surface_variant"
scale = 0.80000000000000004
width = 30

[widget.battery]
show_label = false

[widget.brightness]
show_label = false

[widget.control-center]
glyph = "brand-adobe"

[widget.date]
format = "{:%d - %I:%M}"

[widget.media]
color = "primary"
hide_when_no_media = true
scale = 0.80000000000000004
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.ribbon]
animation_speed = 2.5
type = "luochen1990/niri-ribbon:ribbon"

[widget.volume]
show_label = false

[widget.workspaces]
active_pill_size = 5.0
empty_color = "surface"
font_family = "JetBrainsMono Nerd Font"
font_scale = 0.78000000000000003
font_weight = 800
inactive_pill_size = 1.0
labels_only_when_occupied = true
occupied_color = "secondary"
pill_scale = 0.65000000000000002
scale = 0.94999999999999996
show_labels = false
